[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figentra"
version = "0.1.0"
description = "Reproducible publication-ready scientific figure styling for Matplotlib"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "peterDataScientia"}]
keywords = ["matplotlib", "scientific-figures", "publication", "visualization"]
dependencies = ["matplotlib>=3.6"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Visualization"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.urls]
Homepage = "https://github.com/peterDataScientia/figentra"
Repository = "https://github.com/peterDataScientia/figentra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
