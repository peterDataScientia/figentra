name: Chemistry regression tests
on:
  push:
    paths:
      - 'src/figentra/**'
      - 'tests/**'
      - '.github/workflows/chemistry-tests.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: python -m pip install -e . pytest rdkit cairosvg pillow
      - run: python -m pytest -q
